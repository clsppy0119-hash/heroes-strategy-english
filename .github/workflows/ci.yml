name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # typecheck 會先跑 next typegen：LayoutProps 這類全域型別是 Next 產生的，
      # 乾淨 checkout 上還不存在，直接 tsc 會找不到。
      - name: Typecheck
        run: pnpm typecheck

      # 約束一：元件裡不得出現硬編中文
      - name: No hardcoded CJK in components
        run: pnpm check:i18n

      # 約束三：src/core 必須能整塊搬到伺服器
      - name: Core stays portable
        run: pnpm check:core

      # 改了 CSV 卻忘了跑 gen:vocab 不會有任何症狀，只是安靜地用舊題庫
      - name: Vocab bank in sync with CSV
        run: pnpm check:vocab

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
